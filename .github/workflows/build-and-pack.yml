name: Build and Pack ImGuiFSharp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build C++ Library
        run: |
          mkdir -p cpp/build
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release -j$(nproc)

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: libImGuiNative.so
          path: cpp/build/libImGuiNative.so

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build C++ Library
        run: |
          mkdir cpp/build
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: ImGuiNative.dll
          path: cpp/build/Release/ImGuiNative.dll

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build C++ Library
        run: |
          mkdir -p cpp/build
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release -j$(sysctl -n hw.ncpu)

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: libImGuiNative.dylib
          path: cpp/build/libImGuiNative.dylib

  pack-and-publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: libImGuiNative.so
          path: temp-linux

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: ImGuiNative.dll
          path: temp-win

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: libImGuiNative.dylib
          path: temp-mac

      - name: Copy binaries to runtimes layout
        run: |
          mkdir -p runtimes/linux-x64/native
          mkdir -p runtimes/win-x64/native
          mkdir -p runtimes/osx-x64/native
          mkdir -p runtimes/osx-arm64/native
          
          cp temp-linux/libImGuiNative.so runtimes/linux-x64/native/
          cp temp-win/ImGuiNative.dll runtimes/win-x64/native/
          cp temp-mac/libImGuiNative.dylib runtimes/osx-x64/native/
          cp temp-mac/libImGuiNative.dylib runtimes/osx-arm64/native/

      - name: Pack NuGet
        run: dotnet pack ImGuiFSharp.fsproj -c Release -o out

      - name: Publish to GitHub Packages
        run: dotnet nuget push out/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/thefirstsparkproject/index.json --skip-duplicate
